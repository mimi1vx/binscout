[package]
name = "binscout"
version = "0.5.1"
edition = "2024"
authors = ["Ondřej Súkup <o.sukup@icloud.com>"]
license = "MIT OR Apache-2.0"
description = "Headless, agent-first binary analysis: functions, CFGs, xrefs, strings, and IR over a JSON CLI or MCP server"
homepage = "https://mimi1vx.github.io/binscout/"
repository = "https://github.com/mimi1vx/binscout"
readme = "README.md"
keywords = ["binary-analysis", "disassembly", "mcp", "reverse-engineering"]
exclude = [".beads/"]

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
cpp_demangle = "0.5"
iced-x86 = "1.21"
memmap2 = "0.9"
msvc-demangler = "0.11"
object = "0.40"
petgraph = "0.8"
redb = "4.3"
regex = "1"
rmcp = { version = "3.5", features = ["transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread"] }
yaxpeax-arch = "0.3"
yaxpeax-arm = "0.5"
