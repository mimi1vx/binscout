[package]
name = "rsdbg"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
iced-x86 = "1.21"
memmap2 = "0.9"
object = "0.40"
petgraph = "0.8"
redb = "4.3"
rmcp = { version = "3.5", features = ["transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread"] }
yaxpeax-arch = "0.3"
yaxpeax-arm = "0.5"
