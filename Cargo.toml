[package]
name = "binscout"
version = "0.7.0"
edition = "2024"
authors = ["Ondřej Súkup <o.sukup@icloud.com>"]
license = "MIT OR Apache-2.0"
description = "Headless, agent-first binary analysis: functions, CFGs, xrefs, strings, and IR over a JSON CLI or MCP server"
homepage = "https://mimi1vx.github.io/binscout/"
repository = "https://github.com/mimi1vx/binscout"
readme = "README.md"
keywords = ["binary-analysis", "disassembly", "mcp", "reverse-engineering"]
exclude = [".beads/"]

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
cpp_demangle = "0.5"
fallible-iterator = "0.2"
gimli = { version = "0.33", default-features = false, features = ["endian-reader", "read", "std"] }
iced-x86 = { version = "1.21", features = ["code_asm"] }
memchr = "2"
msvc-demangler = "0.11"
object = "0.40"
pdb = "0.8"
petgraph = "0.8"
redb = "4.3"
regex = "1"
rmcp = { version = "3.5", features = ["transport-io"] }
rvdasm = "0.4"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
yara-x = { version = "1.21.0", default-features = false, optional = true }
yaxpeax-arch = "0.3"
yaxpeax-arm = "0.5"

[features]
yara = ["dep:yara-x"]
