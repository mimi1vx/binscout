# Upstream: https://github.com/VirtuosoAI/yara-x
[[bans.skip]]
name = "gimli"
version = "0.32"
reason = "blocked on upstream: walrus 0.27 (via yara-x) pins gimli 0.32 while binscout uses gimli 0.33 directly; unresolvable by cargo update"

[[bans.skip]]
name = "gimli"
version = "0.33"
reason = "blocked on upstream: binscout uses gimli 0.33 directly while walrus 0.27 (via yara-x) pins gimli 0.32; unresolvable by cargo update"

