# Upstream: https://github.com/VirtuosoAI/yara-x
[[bans.skip]]
name = "wasm-encoder"
version = "0.245"
reason = "blocked on upstream: walrus 0.27 (via yara-x) pins wasm-encoder 0.245 while wasmtime-environ 48 pulls 0.254; unresolvable by cargo update"

[[bans.skip]]
name = "wasm-encoder"
version = "0.254"
reason = "blocked on upstream: wasmtime-environ 48 pulls wasm-encoder 0.254 while walrus 0.27 (via yara-x) pins 0.245; unresolvable by cargo update"

[[bans.skip]]
name = "wasmparser"
version = "0.245"
reason = "blocked on upstream: walrus 0.27 (via yara-x) pins wasmparser 0.245 while wasmtime-environ 48 pulls 0.254; unresolvable by cargo update"

[[bans.skip]]
name = "wasmparser"
version = "0.254"
reason = "blocked on upstream: wasmtime-environ 48 pulls wasmparser 0.254 while walrus 0.27 (via yara-x) pins 0.245; unresolvable by cargo update"

