# cargo-deny configuration for binscout (cargo-deny 0.20 format).
# Policy: pragmatic license allow-list, fail on vulnerabilities and yanked
# crates, deny duplicate crate versions, crates.io-only sources.

[advisories]
# In cargo-deny 0.20 the old vulnerability/unsound/notice lint levels were
# removed: those advisories always fail. Unmaintained advisories default to
# failing on any match. Only yanked remains configurable.
yanked = "deny"

# bincode 2.0.1 enters exclusively via yara-x (optional `yara` feature); the
# bincode team ceased development permanently, so no fixed version exists and
# only a yara-x release dropping bincode can resolve this. Revisit after
# `cargo update` moves bincode out of the graph.
# Upstream: https://github.com/VirtuosoAI/yara-x
[[advisories.ignore]]
id = "RUSTSEC-2025-0141"
reason = "unmaintained bincode 2.0.1 enters only via yara-x; no fixed version exists upstream, revisit after yara-x drops bincode"

[licenses]
# Exact set reported by `cargo deny list`. Every license in the graph is
# allowed; any new license fails the check and needs an explicit addition.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "BSL-1.0",
  "LGPL-2.1-or-later",
  "MIT",
  "NCSA",
  "Unlicense",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "deny"
wildcards = "deny"

# syn 2 vs 3 is a major-version ecosystem split, not fixable by `cargo update`
# (verified 2026-10-16: `cargo update --dry-run` locks 0 packages; all parents
# already at latest). syn 2.0.119 enters via tracing-attributes 0.1.31 <-
# tracing 0.1.44 <- rmcp 3.5.1 (plus windows-implement/windows-interface <-
# windows-core <- iana-time-zone <- chrono on Windows targets, which cargo-deny
# checks on all platforms). syn 3.0.9 enters via clap_derive/darling/serde/
# thiserror/tokio-macros. Upstream tracing has merged the syn 3 bump
# (tokio-rs/tracing#3594) but it is unreleased (0.1.31 still latest on
# crates.io), and the windows-core chain is outside our control.
# Revisit the skips after `cargo update` moves syn 2 out of the graph
# (cargo-deny warns on unused skip entries).
# Upstream: https://github.com/dtolnay/syn
[[bans.skip]]
name = "syn"
version = "2"
reason = "major-version split: tracing-attributes 0.1.31 (via rmcp) and windows-core chain still pin syn 2 while the rest of the graph is on syn 3; unresolvable by cargo update, revisit after upstream releases"

[[bans.skip]]
name = "syn"
version = "3"
reason = "major-version split: clap_derive/darling/serde/thiserror/tokio-macros ecosystem has moved to syn 3 while tracing/windows chains still pin syn 2; unresolvable by cargo update, revisit after upstream releases"

# hashbrown 0.14/0.15/0.16/0.17 lines are pinned by upstream crates, not
# fixable by `cargo update`. 0.14 enters via rowan 0.17.0 <- yara-x-parser;
# 0.15 enters directly via petgraph 0.8.3 <- binscout; 0.16 enters via gimli
# 0.33 <- binscout (and cranelift 0.135); 0.17 enters via wasmtime-internal-core
# 48 <- yara-x (and indexmap 2.x <- petgraph/rmcp). Scoped to the 0.minor
# lines (a bare "0" spec would overmatch). Revisit the skips after
# `cargo update` moves a hashbrown line out of the graph (cargo-deny warns on
# unused skip entries).
# Upstream: https://github.com/petgraph/petgraph
[[bans.skip]]
name = "hashbrown"
version = "0.14"
reason = "blocked on upstream: rowan 0.17.0 (via yara-x-parser) pins hashbrown 0.14 while the rest of the graph is on newer lines; unresolvable by cargo update"

[[bans.skip]]
name = "hashbrown"
version = "0.15"
reason = "blocked on upstream: petgraph 0.8.3 pins hashbrown 0.15 directly while the rest of the graph is on newer lines; unresolvable by cargo update, revisit after petgraph unifies its hashbrown usage"

[[bans.skip]]
name = "hashbrown"
version = "0.16"
reason = "blocked on upstream: gimli 0.33 (and cranelift 0.135) pull hashbrown 0.16 while petgraph pins 0.15 and the yara-x subtree pulls 0.14/0.17; unresolvable by cargo update"

[[bans.skip]]
name = "hashbrown"
version = "0.17"
reason = "blocked on upstream: wasmtime-internal-core 48 (via yara-x) and indexmap 2.x pull hashbrown 0.17 while petgraph pins 0.15; unresolvable by cargo update"

# sha2 0.10 vs 0.11 (with the digest 0.10/0.11, block-buffer, cpufeatures,
# crypto-common lines carried along): wasmtime 48 / cranelift 0.135 pin
# sha2 0.10 while binscout depends on sha2 0.11 directly. Major-line split,
# unfixable by `cargo update`; revisit after wasmtime moves to sha2 0.11.
# Upstream: https://github.com/bytecodealliance/wasmtime
[[bans.skip]]
name = "sha2"
version = "0.10"
reason = "blocked on upstream: wasmtime 48 / cranelift 0.135 pin sha2 0.10 while binscout uses sha2 0.11 directly; unresolvable by cargo update"

[[bans.skip]]
name = "sha2"
version = "0.11"
reason = "blocked on upstream: binscout uses sha2 0.11 directly while wasmtime 48 / cranelift 0.135 pin sha2 0.10; unresolvable by cargo update"

[[bans.skip]]
name = "digest"
version = "0.10"
reason = "blocked on upstream: carried by wasmtime 48's sha2 0.10 pin while binscout's sha2 0.11 pulls digest 0.11; unresolvable by cargo update"

[[bans.skip]]
name = "digest"
version = "0.11"
reason = "blocked on upstream: pulled by binscout's sha2 0.11 while wasmtime 48 pins the digest 0.10 line; unresolvable by cargo update"

[[bans.skip]]
name = "block-buffer"
version = "0.10"
reason = "blocked on upstream: carried by wasmtime 48's digest 0.10 pin; unresolvable by cargo update"

[[bans.skip]]
name = "block-buffer"
version = "0.12"
reason = "blocked on upstream: pulled by binscout's digest 0.11 while wasmtime 48 pins the block-buffer 0.10 line; unresolvable by cargo update"

[[bans.skip]]
name = "crypto-common"
version = "0.1"
reason = "blocked on upstream: carried by wasmtime 48's digest 0.10 pin; unresolvable by cargo update"

[[bans.skip]]
name = "crypto-common"
version = "0.2"
reason = "blocked on upstream: pulled by binscout's digest 0.11 while wasmtime 48 pins the crypto-common 0.1 line; unresolvable by cargo update"

[[bans.skip]]
name = "cpufeatures"
version = "0.2"
reason = "blocked on upstream: carried by wasmtime 48's sha2 0.10 pin; unresolvable by cargo update"

[[bans.skip]]
name = "cpufeatures"
version = "0.3"
reason = "blocked on upstream: pulled by binscout's sha2 0.11 while wasmtime 48 pins the cpufeatures 0.2 line; unresolvable by cargo update"

# itertools 0.14 vs 0.15 and object 0.39 vs 0.40: both splits are internal to
