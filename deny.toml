# Upstream: https://github.com/VirtuosoAI/yara-x
[[bans.skip]]
name = "itertools"
version = "0.14"
reason = "blocked on upstream: wasmtime-internal-cranelift 48 pins itertools 0.14 while yara-x 1.22 uses 0.15; split is internal to the yara-x subtree, unresolvable by cargo update"

[[bans.skip]]
name = "itertools"
version = "0.15"
reason = "blocked on upstream: yara-x 1.22 uses itertools 0.15 while wasmtime-internal-cranelift 48 pins 0.14; split is internal to the yara-x subtree, unresolvable by cargo update"

[[bans.skip]]
name = "object"
version = "0.39"
reason = "blocked on upstream: wasmtime 48 pins object 0.39 while binscout uses object 0.40 directly; unresolvable by cargo update"

[[bans.skip]]
name = "object"
version = "0.40"
reason = "blocked on upstream: binscout uses object 0.40 directly while wasmtime 48 pins object 0.39; unresolvable by cargo update"

