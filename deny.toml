# Major-version ecosystem split, unfixable by `cargo update`.
# Upstream: https://github.com/VirtuosoAI/yara-x
[[bans.skip]]
name = "thiserror"
version = "1"
reason = "major-version split: protobuf 3.7 (via yara-x) pins thiserror 1 while binscout and the rest of the graph use thiserror 2; unresolvable by cargo update"

[[bans.skip]]
name = "thiserror"
version = "2"
reason = "major-version split: binscout and the rest of the graph use thiserror 2 while protobuf 3.7 (via yara-x) pins thiserror 1; unresolvable by cargo update"

[[bans.skip]]
name = "thiserror-impl"
version = "1"
reason = "major-version split: carried by protobuf 3.7's thiserror 1 pin (via yara-x); unresolvable by cargo update"

[[bans.skip]]
